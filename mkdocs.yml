site_name: Team Gamechanger Support-Center
site_url: https://support.jackboxpatch.de/
site_description: Hilfe zu Installation, Updates und Problemen mit den Jackbox-Deutsch-Patches.

nav:
  - Startseite: index.md
  - Installieren & Spielen:
      - Installation mit Jackbox Utility: Installation/JackboxUtility.md
      - Patch aktualisieren und Version prüfen: Installation/aktualisieren.md
      - Mitspielen über Jackbox.de: Wissenswertes/JackboxDE.md
      - Patch entfernen / Spiel zurücksetzen: Deinstallation/index.md
      - Manuelle Installation:
          - Windows: Installation/Windows.md
          - macOS: Installation/macOS.md
  - Probleme lösen:
      - Problembehebung/index.md
      - Das Spiel startet nicht: Problembehebung/SpielStartetNicht.md
      - Spiel oder Controller teilweise auf Englisch: Problembehebung/UnvollstaendigeUebersetzung.md
      - Probleme mit Jackbox Utility: Problembehebung/JackboxUtility.md
      - Probleme unter macOS: Problembehebung/MacOSFehlermeldung.md
      - Fehler melden & Hilfe bekommen: Wissenswertes/BugReport.md
  - Spiele & Übersetzungen:
      - Spiele/index.md
      - "YOU DON'T KNOW JACK: Full Stream – FAQ": Wissenswertes/YDKJ.md
      - Trivia Murder Party 3 – Besonderheiten: Spiele/trivia-murder-party-3.md
      - Guesspionage – Herkunft der Umfragedaten: Wissenswertes/GuesspionageDaten.md
      - Warum bestimmte Übersetzungen nicht mehr verfügbar sind: Wissenswertes/PartyStarterRelease.md
      - Übersetzungen in anderen Sprachen: Wissenswertes/AndereSprachen.md
  - Über das Projekt:
      - Projekt/index.md
      - Mitwirkende & Credits: Wissenswertes/DasTeam.md
      - Mitmachen: Wissenswertes/Mitmachen.md
      - Finanziell unterstützen: Wissenswertes/Unterstützung.md
      - Erlaubnis und Nutzung der Patches: Wissenswertes/Legal.md

exclude_docs: |
  /venv/
  /.venv/

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

theme:
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
    tag:
      windows: fontawesome/brands/windows
      mac: fontawesome/brands/apple
      linux: fontawesome/brands/linux
    annotation: material/chevron-right-circle
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: de
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: In den Dark-Mode wechseln
      primary: custom
      accent: purple
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: In den Light-Mode wechseln
      primary: custom
      accent: lime

extra:
  social:
    - icon: fontawesome/brands/twitter
      link: https://x.com/jackboxDE
    - icon: fontawesome/brands/discord
      link: https://discord.gg/vGcu9HWde4
    - icon: fontawesome/brands/ko-fi
      name: Team Gamechanger auf Ko-fi unterstützen
      link: https://ko-fi.com/teamgamechanger
    - icon: fontawesome/brands/patreon
      link: https://patreon.com/jackboxpatch
    - icon: fontawesome/brands/paypal
      link: https://www.paypal.com/donate/?hosted_button_id=GME4RQWR38Y4J&locale.x=de_DE
    - icon: fontawesome/brands/github
      link: https://github.com/Team-Gamechanger
  generator: false
  tags:
    Windows: windows
    macOS: mac
    Linux / Steam Deck: linux

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/copy-heading-link.js

markdown_extensions:
  - toc:
      permalink: "🔗"
      permalink_title: Link zu diesem Abschnitt kopieren
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright:
  © 2026 <a href="https://github.com/Team-Gamechanger" target="_blank" rel="noopener">Team Gamechanger</a>

plugins:
  - redirects:
      redirect_maps:
        Deinstallation/JackboxUtility.md: Deinstallation/index.md
        Deinstallation/Steam.md: Deinstallation/index.md
        Deinstallation/EpicGames.md: Deinstallation/index.md
  - search
  - tags
